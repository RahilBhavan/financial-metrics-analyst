name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyflakes==4.0.3
      - run: python -m pyflakes .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B -m unittest discover -s tests
      - run: python -B -m financial_metrics smoke
      - name: Committed reports match current code
        run: |
          python -B scripts/regenerate_reports.py
          git diff --exit-code reports/

  sdk-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sdk-test.txt
      - run: python -m pip install --require-hashes -r requirements-sdk-test.txt
      - run: python -B scripts/verify_sdk.py

  treasury-snapshot:
    # Rebuild data/treasury/snapshot.json from dat-accretion at its pinned commit and require byte equality.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check out dat-accretion at the snapshot's commit
        run: |
          commit=$(python -c "import json; print(json.load(open('data/treasury/snapshot.json'))['source']['commit'])")
          git clone --quiet https://github.com/RahilBhavan/dat-accretion "$RUNNER_TEMP/dat-accretion"
          git -C "$RUNNER_TEMP/dat-accretion" checkout --quiet "$commit"
      - run: python -B -m unittest tests.test_treasury -v
        env:
          DAT_ACCRETION_REPO: ${{ runner.temp }}/dat-accretion
