name: Live SEC refresh check

on:
  workflow_dispatch:
    inputs:
      contact:
        description: Real contact email for the SEC User-Agent
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The input goes through env, never into the script text, so it cannot inject shell commands.
      - run: python -B scripts/live_refresh_check.py --user-agent "financial-metrics-analyst $CONTACT" --output "$RUNNER_TEMP/live-refresh.json"
        env:
          CONTACT: ${{ inputs.contact }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-refresh
          path: ${{ runner.temp }}/live-refresh.json
